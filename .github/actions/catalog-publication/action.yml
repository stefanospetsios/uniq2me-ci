name: Checkpoint and publish prepared catalog work
description: Keep Git credentials separate from inference and upload before pushing
inputs:
  command:
    required: true
    description: Trusted preparation command
  checkpoint:
    required: true
    description: Unique checkpoint suffix for this publication
  sfs:
    default: ''
    description: SFS identifier
  sf:
    default: ''
    description: SF identifier
  push_token:
    required: true
    description: Output publication credential, never passed to inference
  checkpoint_url:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: ''
  checkpoint_user:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: 'checkpoint'
  checkpoint_pass:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: ''
runs:
  using: composite
  steps:
  - name: Prepare exact checked commit
    id: prepare
    shell: bash
    env:
      PUSH_TOKEN: ${{ inputs.push_token }}
      PUBLICATION_COMMAND: ${{ inputs.command }}
      SFS_ID: ${{ inputs.sfs }}
      SF_ID: ${{ inputs.sf }}
    run: |
      args=("$PUBLICATION_COMMAND")
      [[ -z "$SFS_ID" ]] || args+=("$SFS_ID")
      [[ -z "$SF_ID" ]] || args+=("$SF_ID")
      python controller/ci/incremental.py "${args[@]}"
  - name: Seal prepared commit and recoverable execution state
    if: steps.prepare.outputs.active == 'true'
    shell: bash
    run: python controller/ci/checkpoints.py seal
  - name: Save verified checkpoint in Nexus
    id: nexus_upload
    if: ${{ steps.prepare.outputs.active == 'true' && inputs.checkpoint_url != '' }}
    shell: bash
    env:
      CHECKPOINT_URL: ${{ inputs.checkpoint_url }}
      CHECKPOINT_USER: ${{ inputs.checkpoint_user }}
      CHECKPOINT_PASS: ${{ inputs.checkpoint_pass }}
      CHECKPOINT_NAME: uniq2me-checkpoint-${{ github.run_id }}-${{ inputs.checkpoint }}-${{ github.run_attempt }}
    run: python controller/ci/nexus_checkpoints.py upload
  - name: Save checkpoint before remote mutation
    id: checkpoint_upload
    if: ${{ steps.prepare.outputs.active == 'true' && inputs.checkpoint_url == '' }}
    uses: actions/upload-artifact@v4
    with:
      name: uniq2me-checkpoint-${{ github.run_id }}-${{ inputs.checkpoint }}-${{ github.run_attempt }}
      path: ${{ runner.temp }}/uniq2me-run/
      include-hidden-files: true
      if-no-files-found: error
      retention-days: 30
  - name: Retain the two latest checkpoints of this run
    if: ${{ always() && steps.checkpoint_upload.outcome == 'success' }}
    shell: bash
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CHECKPOINT_ARTIFACT_ID: ${{ steps.checkpoint_upload.outputs.artifact-id }}
      CHECKPOINT_ARTIFACT_DIGEST: ${{ steps.checkpoint_upload.outputs.artifact-digest }}
    run: python controller/ci/checkpoint_retention.py
  - name: Publish with exact leases
    if: steps.prepare.outputs.active == 'true'
    shell: bash
    env:
      PUSH_TOKEN: ${{ inputs.push_token }}
    run: python controller/ci/incremental.py publish
