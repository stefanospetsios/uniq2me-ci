      checkpoint_user: ${{ inputs.checkpoint_user }}
      checkpoint_pass: ${{ inputs.checkpoint_pass }}
      mcp_headers: ${{ inputs.mcp_headers }}
  - name: Check the complete SFS roster and translations
    if: steps.begin.outputs.active == 'true'
    shell: bash
    env:
      MCP_HEADERS_JSON: ${{ inputs.mcp_headers }}
      SFS_ID: ${{ inputs.sfs }}
    run: python controller/ci/incremental.py finish-sfs "$SFS_ID"
  - name: Checkpoint and consolidate this SFS
    if: steps.begin.outputs.active == 'true'
    uses: ./controller/.github/actions/catalog-publication
    with:
      command: prepare-sfs
      sfs: ${{ inputs.sfs }}
      checkpoint: sfs-${{ inputs.model_pass }}-${{ inputs.sfs }}
      push_token: ${{ inputs.push_token }}
      checkpoint_url: ${{ inputs.checkpoint_url }}
      checkpoint_user: ${{ inputs.checkpoint_user }}
      checkpoint_pass: ${{ inputs.checkpoint_pass }}
