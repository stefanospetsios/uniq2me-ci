name: Process one Scoring Factor Set
description: Publish every SF, then consolidate only this run's SF commits
inputs:
  sfs:
    required: true
    description: SFS identifier
  model_pass:
    required: true
    description: Selected model pass
  push_token:
    required: true
    description: Output credential reserved for publication steps
  mcp_headers:
    default: ''
    description: Retrieval server headers
  checkpoint_url:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: ''
  checkpoint_user:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: 'checkpoint'
  checkpoint_pass:
    description: Scoped Nexus checkpoint setting; never passed to inference
    default: ''
runs:
  using: composite
  steps:
  - name: Select pending work in this SFS and pass
    id: begin
    shell: bash
    env:
      SFS_ID: ${{ inputs.sfs }}
      MODEL_PASS: ${{ inputs.model_pass }}
    run: python controller/ci/incremental.py begin "$SFS_ID" --pass "$MODEL_PASS"
  - name: 'SF #0'
    if: steps.begin.outputs.active == 'true'
    uses: ./controller/.github/actions/refine-factor
    with:
      sfs: ${{ inputs.sfs }}
      sf: '0'
      model_pass: ${{ inputs.model_pass }}
      push_token: ${{ inputs.push_token }}
      checkpoint_url: ${{ inputs.checkpoint_url }}
      checkpoint_user: ${{ inputs.checkpoint_user }}
      checkpoint_pass: ${{ inputs.checkpoint_pass }}
      mcp_headers: ${{ inputs.mcp_headers }}
  - name: 'SF #1'
    if: steps.begin.outputs.active == 'true'
    uses: ./controller/.github/actions/refine-factor
    with:
      sfs: ${{ inputs.sfs }}
      sf: '1'
      model_pass: ${{ inputs.model_pass }}
      push_token: ${{ inputs.push_token }}
      checkpoint_url: ${{ inputs.checkpoint_url }}
      checkpoint_user: ${{ inputs.checkpoint_user }}
      checkpoint_pass: ${{ inputs.checkpoint_pass }}
      mcp_headers: ${{ inputs.mcp_headers }}
  - name: 'SF #2'
    if: steps.begin.outputs.active == 'true'
    uses: ./controller/.github/actions/refine-factor
