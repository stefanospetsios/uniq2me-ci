name: Validate shared controller
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_PROFILE: ''
      CONTROLLER_UPDATES: ''
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install test dependencies
      run: python -m pip install -r requirements-ci.txt
    - name: Audit public files and history
      run: python ci/audit_public.py --history
    - name: Run offline controller and migration tests
      run: python -m unittest discover -s agent-rules/tests
'on':
  push:
    branches:
    - main
  pull_request: null
