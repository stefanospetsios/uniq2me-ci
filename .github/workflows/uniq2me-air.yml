
name: OpenCode Multi-Repo Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Operation for OpenCode"
        required: true
        type: string
      push:
        description: "Push changes to uniq2me-ai"
        type: boolean
        default: true
  workflow_call:
    inputs:
      task:
        description: "Operation for OpenCode"
        required: true
        type: string
      push:
        description: "Push changes to uniq2me-ai"
        type: boolean
        default: true


jobs:
  opencode:
    runs-on: [self-hosted, hyperion]
    timeout-minutes: 4320

    permissions:
      contents: read

    env:
      OPENCODE_CONFIG: ${{ github.workspace }}/opencode.json
      TARGET_BRANCH: qwen3-20261010/en

    steps:
      # 1. Workflow repository and configuration
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare environment
        uses: stefanospetsios/actions-prepare-envs@main
        id: prepare_envs

      # 2. Source repositories
      - name: Checkout template_static
        uses: actions/checkout@v4
        with:
          repository: stefanospetsios/template_static
          token: ${{ secrets.uniq2me_token }}
          path: static
          ref: v4
          persist-credentials: false

      - name: Checkout stefanos
        uses: actions/checkout@v4
        with:
          repository: stefanospetsios/stefanos
          token: ${{ secrets.uniq2me_token }}
          path: stefanos
          ref: en/development
          persist-credentials: false

      - name: Checkout uniq2me
        uses: actions/checkout@v4
        with:
          repository: stefanospetsios/uniq2me
          token: ${{ secrets.uniq2me_token }}
          path: uniq2me
          ref: en/staging
          persist-credentials: false

      # 3. Destination repository
      - name: Checkout uniq2me-ai
        uses: actions/checkout@v4
        with:
          repository: stefanospetsios/uniq2me-ai
          token: ${{ secrets.uniq2me_token }}
          path: uniq2me-ai
          persist-credentials: false

      # 4. Prepare destination branch
      - name: Prepare target branch
        env:
          PUSH_TOKEN: ${{ secrets.uniq2me_token }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/uniq2me-ai"

          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" \
            | base64 -w0)

          if git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            ls-remote --exit-code \
            --heads origin "$TARGET_BRANCH" >/dev/null; then

            echo "Existing branch: $TARGET_BRANCH"

            git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
              fetch origin \
              "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

            git switch -C "$TARGET_BRANCH" \
              "refs/remotes/origin/$TARGET_BRANCH"
          else
            echo "Creating branch: $TARGET_BRANCH"
            git switch -c "$TARGET_BRANCH"
          fi

          echo "lala" > lala

          echo "Branch prepared"
          git status --short --branch

      # 5. Verify OpenCode
      - name: Verify OpenCode
        shell: bash
        run: |
          set -euo pipefail

          opencode --version
          test -f "$OPENCODE_CONFIG"
          jq empty "$OPENCODE_CONFIG"

          echo "Configuration OK"

      # 6. Verify repositories
      - name: Verify repositories
        shell: bash
        run: |
          set -euo pipefail

          for repo in static stefanos uniq2me uniq2me-ai; do
            echo "===== $repo ====="
            git -C "$repo" log -1 --format='%h %s'
            git -C "$repo" status --short --branch
          done

      # 7. Check MCP servers
      - name: Check MCP servers
        shell: bash
        run: |
          opencode mcp list

      # 8. Run OpenCode
      - name: Run OpenCode automation
        env:
          GH_TOKEN: ${{ secrets.uniq2me_token }}
          GITHUB_TOKEN: ${{ secrets.uniq2me_token }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          cat > "$RUNNER_TEMP/opencode-task.txt" <<'EOF'
          You are an autonomous software engineering agent.

          You have access to four repositories:

          SOURCE REPOSITORIES:

          1. static/
             stefanospetsios/template_static
             Ref: v4

          2. stefanos/
             stefanospetsios/stefanos
             Branch: en/development

          3. uniq2me/
             stefanospetsios/uniq2me
             Branch: en/staging

          DESTINATION REPOSITORY:

          4. uniq2me-ai/
             stefanospetsios/uniq2me-ai
             Branch: qwen3-20261010/en

          Instructions:

          - Analyze the repositories as needed.
          - You may edit files when required by the task.
          - The destination repository is uniq2me-ai.
          - A test file named lala is already present there.
          - Do not create git commits.
          - Do not push to GitHub.
          - Git commits and pushes are handled by the workflow.
          - Explain your work at the end.

          USER TASK:
          EOF

          printf '\n%s\n' "$TASK" \
            >> "$RUNNER_TEMP/opencode-task.txt"

          echo "Starting OpenCode"

          opencode run \
            --dir "$GITHUB_WORKSPACE" \
            "$(cat "$RUNNER_TEMP/opencode-task.txt")"

      # 9. Display changes
      - name: Show changes
        if: always()
        shell: bash
        run: |
          for repo in static stefanos uniq2me uniq2me-ai; do

            if [[ ! -d "$repo/.git" ]]; then
              continue
            fi

            echo "===== $repo ====="

            git -C "$repo" status --short
            git -C "$repo" diff --stat || true

          done

      # 10. Commit and push destination repository
      - name: Push to uniq2me-ai
        if: ${{ success() && inputs.push }}
        env:
          PUSH_TOKEN: ${{ secrets.uniq2me_token }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/uniq2me-ai"

          git config user.name "OpenCode Agent"
          git config user.email \
            "opencode@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit or push"
            exit 0
          fi

          git commit -m \
            "chore: OpenCode Qwen3 automation"

          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" \
            | base64 -w0)

          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Successfully pushed to $TARGET_BRANCH"

      # 11. Summary
      - name: Job summary
        if: always()
        env:
          PUSH_ENABLED: ${{ inputs.push }}
        shell: bash
        run: |
          {
            echo "## OpenCode Multi-Repo Agent"
            echo
            echo "- Runner: hyperion"
            echo "- Model: kic/qwen3:235b"
            echo "- Destination: stefanospetsios/uniq2me-ai"
            echo "- Branch: $TARGET_BRANCH"
            echo "- Push requested: $PUSH_ENABLED"
            echo
            echo "### Repository status"
            for repo in static stefanos uniq2me uniq2me-ai; do
              echo
              echo "#### $repo"
              echo '```text'
              git -C "$repo" status --short \
                2>/dev/null || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

          